[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-mask-generator"
version = "0.1.0"
description = "Cell mask generation plugin for densely packed adipocytes"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = [
    "napari>=0.4.18",
    "numpy",
    "scikit-image",
    "scipy",
    "magicgui",
    "tifffile",
    "qtpy",
]

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-qt",
    "napari[testing]",
]

[project.entry-points."napari.manifest"]
napari-mask-generator = "napari_mask_generator:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}